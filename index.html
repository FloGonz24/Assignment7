<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Untitled Document</title>
<style>
    @font-face {
        font-family: Candara;
        src: url("Candara.ttf");
    } h1 {
        text-align: center;
        font-weight: normal;
    } form {
        width: 600px;
        min-height: 600px;
        padding: 24px;
        background: #9F68E1;
        margin: 36px auto;
        border: 1px solid #701FD2;
        box-shadow: 2px 3px 6px #701FD2;
        border-radius: 18px;
        font: 14pt/1.2em Candara;
    } fieldset {
        margin-top: 18px;
    } #personal input, #submit {
        width: 100%;
        height: 24px;
        margin-bottom: 12px;
	} input[type="text"] {
		width: 98%;
		font: 12pt/1.4em Roboto;
	} select{
		width: 50%;
		font: 12pt/1.4em Roboto;
		padding: 2px 4px;
	} textarea {
		width: 98%;
	} input[type="submit"] {
		width: 100px;
		height: 40px;
		background-color: yellow;
		display: block;
		margin: 0 auto;
	}
	
</style>
</head>

<body>
    <form action="#" method="post">
    <h1>Puppy Pictures</h1>
		
		<label>First Name</label><br/>
		<input type="text" /><br/>
		<label>Last Name</label><br/>
		<input type="text" /><br/>
		<label>Email or Phone Number</label><br/>
		<input type="text" /><br/>
		
		<fieldset>
			<legend>What is your dog's size?</legend>
		<input type="radio" name="os" /><label>Small</label><br/>
		<input type="radio" name="os"/><label>Medium</label><br/>
		<input type="radio" name="os"/><label>Large</label><br/>
		</fieldset>
		
		<fieldset>
		<legend>What kind of photos?</legend>
		<input type="checkbox"><label>Playful Shot</label><br/>
		<input type="checkbox"><label>Sitting Still</label><br/>
		<input type="checkbox"><label>Props and More</label><br/>
		</fieldset><br/>
			
		<label>How Many Images?</label><br/>
		<select>
		<option>5</option>
		<option>10</option>
		<option>15</option>
		<option>25</option>
		<option>50</option>
		</select>
		<br/><br/>
		
		<label>Extra Information</label><br/>
		<textarea>
		</textarea>
		<input type="submit" value="Submit" />
    </form>
</body>
</html>
